    - endpoints: ["A-P2:eth2", "A-P3:eth2"]
    - endpoints: ["A-P3:eth3", "A-P4:eth2"]
    - endpoints: ["A-P1:eth3", "A-P4:eth1"]
    - endpoints: ["A-P1:eth2", "A-P3:eth1"]
    - endpoints: ["A-P1:eth4", "A-PE1:eth1"]
    - endpoints: ["A-P2:eth3", "A-PE1:eth2"]
    - endpoints: ["A-P3:eth4", "A-PE2:eth1"]
    - endpoints: ["A-P4:eth3", "A-PE2:eth2"]
    - endpoints: ["A-P1:eth5", "A-RR:Gi0-0-0-0"]
    - endpoints: ["A-P1:eth6", "A-ASBR:eth1"]
    - endpoints: ["A-P4:eth4", "A-ASBR:eth2"]

    - endpoints: ["A-PE1:eth3", "CustA-HQ:eth1"]
    - endpoints: ["A-PE1:eth4", "CustB-Hub:eth1"]
    - endpoints: ["A-PE2:eth3", "CustA-Br1:eth1"]
    - endpoints: ["A-PE2:eth4", "CustB-Spk1:eth1"]
    - endpoints: ["A-PE2:eth5", "CustC-Core1:eth1"]

    - endpoints: ["B-P1:eth1", "B-P2:eth1"]
    - endpoints: ["B-P2:eth2", "B-P3:eth2"]
    - endpoints: ["B-P3:eth3", "B-P4:eth2"]
    - endpoints: ["B-P1:eth3", "B-P4:eth1"]
    - endpoints: ["B-P1:eth2", "B-P3:eth1"]
    - endpoints: ["B-P1:eth4", "B-PE1:eth1"]
    - endpoints: ["B-P2:eth3", "B-PE1:eth2"]
    - endpoints: ["B-P3:eth4", "B-PE2:eth1"]
    - endpoints: ["B-P4:eth3", "B-PE2:eth2"]
    - endpoints: ["B-P1:eth7", "B-PE2:eth5"]
    - endpoints: ["B-P1:eth5", "B-RR:Gi0-0-0-0"]
    - endpoints: ["B-P1:eth6", "B-ASBR:eth1"]
    - endpoints: ["B-P4:eth4", "B-ASBR:eth2"]

    - endpoints: ["B-PE1:eth3", "CustA-Br2:eth1"]
    - endpoints: ["B-PE1:eth4", "CustC-Core2:eth1"]
    - endpoints: ["B-PE2:eth3", "CustB-Spk2:eth1"]
    - endpoints: ["B-PE2:eth4", "CustC-Core3:eth1"]

    - endpoints: ["A-ASBR:eth3", "B-ASBR:eth3"]
