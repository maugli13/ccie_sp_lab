      mgmt-ipv4: 172.20.30.112
      startup-config: lab_configs/CustB-Spk1/baseline.partial.cfg
    CustB-Spk2:
      kind: cisco_iol
      mgmt-ipv4: 172.20.30.113
      startup-config: lab_configs/CustB-Spk2/baseline.partial.cfg

    CustC-Core1:
      kind: cisco_csr1000v
