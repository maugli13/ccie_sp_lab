      startup-delay: 600
      mgmt-ipv4: 172.20.30.25
      startup-config: lab_configs/B-PE1/baseline.cfg
    B-PE2:
      kind: cisco_xrv9k
      startup-delay: 600
      mgmt-ipv4: 172.20.30.26
      startup-config: lab_configs/B-PE2/baseline.cfg
    B-RR:
      kind: cisco_xrd
      startup-delay: 30
      mgmt-ipv4: 172.20.30.27
      startup-config: lab_configs/B-RR/baseline.cfg
    B-ASBR:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.28
      startup-config: lab_configs/B-ASBR/baseline.cfg

    CustA-HQ:
      kind: cisco_iol
      mgmt-ipv4: 172.20.30.101
