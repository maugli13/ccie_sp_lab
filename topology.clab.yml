name: spv5-main

mgmt:
  network: spv5-mgmt
  ipv4-subnet: 172.20.30.0/24

topology:
  kinds:
    cisco_xrv9k:
      image: vrnetlab/cisco_xrv9k:7.7.1
    cisco_xrd:
      image: ios-xr/xrd-control-plane:7.9.2
    cisco_csr1000v:
      image: vrnetlab/cisco_csr1000v:16.09.08
    cisco_iol:
      image: vrnetlab/cisco_iol:17.15.01

  nodes:
    A-P1:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.11
      startup-config: lab_configs/A-P1/baseline.cfg
    A-P2:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.12
      startup-config: lab_configs/A-P2/baseline.cfg
    A-P3:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.13
      startup-config: lab_configs/A-P3/baseline.cfg
    A-P4:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.14
      startup-config: lab_configs/A-P4/baseline.cfg
    A-PE1:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.15
      startup-config: lab_configs/A-PE1/baseline.cfg
    A-PE2:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.16
      startup-config: lab_configs/A-PE2/baseline.cfg
    A-RR:
      kind: cisco_xrd
      startup-delay: 30
      mgmt-ipv4: 172.20.30.17
      startup-config: lab_configs/A-RR/baseline.cfg
    A-ASBR:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.18
      startup-config: lab_configs/A-ASBR/baseline.cfg

    B-P1:
      kind: cisco_xrv9k
      startup-delay: 600
      mgmt-ipv4: 172.20.30.21
      startup-config: lab_configs/B-P1/baseline.cfg
    B-P2:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.22
      startup-config: lab_configs/B-P2/baseline.cfg
    B-P3:
      kind: cisco_csr1000v
      startup-delay: 300
      mgmt-ipv4: 172.20.30.23
      startup-config: lab_configs/B-P3/baseline.cfg
