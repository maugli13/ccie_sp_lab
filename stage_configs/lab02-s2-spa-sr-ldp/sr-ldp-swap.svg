    <text x="62" y="256" font-size="11.5" fill="#334155">LDP label: 1312 (A-P3),</text>
    <text x="62" y="272" font-size="11.5" fill="#334155">1407 (A-P4)</text>
    <circle cx="45" cy="306" r="9" fill="#0f766e"/>
    <text x="45" y="310" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="62" y="310" font-size="12.5" font-weight="600" fill="#0f172a">A-P3, A-P4 pop</text>
    <text x="62" y="328" font-size="11.5" fill="#334155">A-PE2 advertises</text>
    <text x="62" y="344" font-size="11.5" fill="#334155">implicit-null for 10.1.0.106</text>
    <circle cx="45" cy="378" r="9" fill="#334155"/>
    <text x="45" y="382" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="62" y="382" font-size="12.5" font-weight="600" fill="#0f172a">A-PE2</text>
    <text x="62" y="400" font-size="11.5" fill="#334155">receives the IP packet</text>
  </g>
