  <polygon points="203,261 197,249 209,249" fill="#1d4ed8"/>
  <text x="215" y="244" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">import RT 64502:60</text>
  <rect x="187" y="262" width="176" height="138" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="275" y="282" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">VRF CustF</text>
  <text x="275" y="304" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">IPv4 address family:</text>
  <text x="275" y="321" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">inter-as-hybrid</text>
  <text x="275" y="337" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">next-hop 10.255.0.14</text>
  <text x="275" y="361" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">IPv6 address family:</text>
  <text x="275" y="378" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">no inter-as-hybrid</text>
  <rect x="825" y="92" width="200" height="320" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
