  <text x="275" y="116" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">A-ASBR</text>
  <text x="275" y="134" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">10.1.0.8</text>
  <rect x="187" y="146" width="176" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="166" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Global table</text>
