  <text x="925" y="186" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">neighbor 10.255.0.29</text>
  <text x="925" y="203" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">inter-as-hybrid</text>
  <line x1="853" y1="220" x2="853" y2="251" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="853,261 847,249 859,249" fill="#1d4ed8"/>
  <text x="865" y="244" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">import RT 64501:60</text>
  <rect x="837" y="262" width="176" height="138" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="925" y="282" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">VRF CustF</text>
  <text x="925" y="304" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">IPv4 address family:</text>
  <text x="925" y="321" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">inter-as-hybrid</text>
  <text x="925" y="337" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">next-hop 10.255.0.13</text>
  <text x="925" y="361" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">IPv6 address family:</text>
  <text x="925" y="378" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">no inter-as-hybrid</text>
  <text x="600" y="148" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Gi4.251, VLAN 251, global table, IPv4 only</text>
  <text x="385" y="170" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start">10.255.0.29</text>
  <text x="815" y="170" font-size="13.5" font-weight="500" fill="#334155" text-anchor="end">10.255.0.30</text>
