  <polygon points="363,346 375,340 375,352" fill="#b45309"/>
  <polygon points="837,346 825,340 825,352" fill="#b45309"/>
  <rect x="493.15" y="335" width="213.7" height="22" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="600" y="351" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">IPv6 eBGP session, Option A</text>
  <text x="600" y="382" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">IPv4 routing-table next hop and IPv6 BGP next hop on this link</text>
  <text x="600" y="437" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Gi4 also carries Gi4.30 (Option A, CustC), Gi4.254 (Option C) and Gi4.255 (Option B, CustA).</text>
