  <polygon points="837,182 825,176 825,188" fill="#b45309"/>
  <rect x="525.1" y="171" width="149.8" height="22" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="600" y="187" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">VPNv4 eBGP session</text>
  <text x="600" y="209" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">CustF&#x27;s IPv4 routes, with the BGP next hop on this link</text>
  <text x="600" y="227" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">No customer traffic</text>
  <line x1="385" y1="240" x2="815" y2="240" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="600" y="264" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Gi4.253, VLAN 253, VRF CustF, dual-stack</text>
  <text x="385" y="290" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start">10.255.0.13</text>
  <text x="815" y="290" font-size="13.5" font-weight="500" fill="#334155" text-anchor="end">10.255.0.14</text>
