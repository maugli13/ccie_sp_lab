  <text x="32" y="712" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Each stack is the packet on that link, outermost label on top. 16650: B-PE2's algorithm-128 prefix-SID. 24006: the VPN label for 10.30.0.3.</text>
  <text x="32" y="734" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Dashed amber: the BGP route with colour 128. Teal: PCEP sessions. Dotted grey: BGP-LS. Blue: IOS XR. Grey: CSR1000v.</text>
  <text x="32" y="756" font-size="13" font-weight="400" fill="#334155" text-anchor="start">B-PE2 has its own colour-128 policy to 10.2.0.5 for traffic from Core3 to Core2.</text>
