  <text x="150" y="152" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">10.1.0.5</text>
  <rect x="455" y="110" width="150" height="56" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="530" y="134" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">A-P1</text>
  <text x="530" y="152" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">10.1.0.1</text>
  <rect x="815" y="110" width="150" height="56" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="890" y="134" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">A-P3</text>
  <text x="890" y="152" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">10.1.0.3</text>
