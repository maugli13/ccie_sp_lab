  <text x="1270" y="134" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">A-PE2</text>
  <text x="1270" y="152" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">10.1.0.6</text>
  <text x="530" y="186" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">root of tree 1</text>
  <text x="890" y="186" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">root of tree 2</text>
