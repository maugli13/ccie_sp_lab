<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 610" width="1420" height="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1420" height="610" fill="#ffffff"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">CustA's default MDT: two MP2MP trees</text>
  <text x="32" y="63" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Labels from show mpls mldp database on A-PE1, A-P1, A-P3, and A-PE2; byte counts from show mpls forwarding-table</text>
  <text x="32" y="81" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">| i mdt on A-P1 with CustA-HQ sending to 239.10.10.10; metrics from show mpls mldp root on A-PE2.</text>
