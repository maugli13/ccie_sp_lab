  <text x="24" y="366" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Grey: iBGP to A-RR and B-RR, from the BGP labelled unicast stage. Blue: eBGP from the Option C stage, where A-ASBR sends</text>
