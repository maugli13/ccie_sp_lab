  <text x="242.0" y="164" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">route to 10.1.0.5/32, A-PE1</text>
  <rect x="52" y="186" width="380" height="104" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
