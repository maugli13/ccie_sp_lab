<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 470" width="1420" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1420" height="470" fill="#ffffff"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">The route each node installs for a loopback</text>
  <text x="32" y="63" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Installed routes from show ip route on A-PE2 and A-ASBR and show route detail on B-PE1. Labelled unicast paths from show bgp ipv4 unicast</text>
  <text x="32" y="81" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">10.1.0.5/32 on A-PE2, show bgp ipv4 unicast labels on A-ASBR and show bgp ipv4 labeled-unicast labels on B-PE1.</text>
