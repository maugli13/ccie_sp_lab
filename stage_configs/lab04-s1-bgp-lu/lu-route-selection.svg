  <text x="68" y="332" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">not installed</text>
  <text x="68" y="360" font-size="15" font-weight="600" fill="#475569" text-anchor="start">iBGP labelled unicast, distance 200</text>
  <text x="68" y="384" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">from A-RR, label imp-null</text>
  <text x="68" y="406" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="start">RIB-failure</text>
