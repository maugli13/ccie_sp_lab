!
! Baseline (IP-only) - B-P2
! Platform: CSR1000v 16.09.08 (IOS-XE)
! Role: SP-B core P router (non-Flex-Algo - Flex-Algo/SRv6 transit stays on B-P1)
! Loopback: 10.2.0.2/32 · 2001:db8:2::2/128
!
hostname B-P2
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 10.2.0.2 255.255.255.255
 ipv6 address 2001:DB8:2::2/128
!
interface GigabitEthernet2
 description to B-P1
 ip address 10.2.1.2 255.255.255.252
 ipv6 address 2001:DB8:2:10::2/64
 no shutdown
!
interface GigabitEthernet3
 description to B-P3
 ip address 10.2.1.5 255.255.255.252
 ipv6 address 2001:DB8:2:11::1/64
 no shutdown
!
interface GigabitEthernet4
 description to B-PE1
 ip address 10.2.1.25 255.255.255.252
 ipv6 address 2001:DB8:2:16::1/64
 no shutdown
!
end
