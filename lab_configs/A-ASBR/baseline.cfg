!
! Baseline (IP-only) - A-ASBR
! Platform: CSR1000v 16.09.08 (IOS-XE)
! Role: SP-A ASBR (Inter-AS border toward SP-B - classic only, no SRv6 IGW)
! Loopback: 10.1.0.8/32 · 2001:db8:1::8/128
!
hostname A-ASBR
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 10.1.0.8 255.255.255.255
 ipv6 address 2001:DB8:1::8/128
!
interface GigabitEthernet2
 description to A-P1
 ip address 10.1.1.42 255.255.255.252
 ipv6 address 2001:DB8:1:1a::2/64
 no shutdown
!
interface GigabitEthernet3
 description to A-P4
 ip address 10.1.1.46 255.255.255.252
 ipv6 address 2001:DB8:1:1b::2/64
 no shutdown
!
interface GigabitEthernet4
 description to B-ASBR (Inter-AS)
 ip address 10.255.0.1 255.255.255.252
 ipv6 address 2001:DB8:FF::1/64
 no shutdown
 service instance 4094 ethernet
  encapsulation dot1q 4094
 !
!
end
