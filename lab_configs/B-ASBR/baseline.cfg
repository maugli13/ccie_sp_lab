!
! Baseline (IP-only) - B-ASBR
! Platform: CSR1000v 16.09.08 (IOS-XE)
! Role: SP-B ASBR (Inter-AS border toward SP-A - classic only, no SRv6 IGW)
! Loopback: 10.2.0.8/32 · 2001:db8:2::8/128
!
hostname B-ASBR
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 10.2.0.8 255.255.255.255
 ipv6 address 2001:DB8:2::8/128
!
interface GigabitEthernet2
 description to B-P1
 ip address 10.2.1.42 255.255.255.252
 ipv6 address 2001:DB8:2:1a::2/64
 no shutdown
!
interface GigabitEthernet3
 description to B-P4
 ip address 10.2.1.46 255.255.255.252
 ipv6 address 2001:DB8:2:1b::2/64
 no shutdown
!
interface GigabitEthernet4
 description to A-ASBR (Inter-AS)
 ip address 10.255.0.2 255.255.255.252
 ipv6 address 2001:DB8:FF::2/64
 no shutdown
 service instance 4094 ethernet
  encapsulation dot1q 4094
 !
!
end
